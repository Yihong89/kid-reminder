<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.18)"/>
    </linearGradient>
  </defs>

  <!-- rounded squircle with a small margin; the corners stay transparent -->
  <rect x="56" y="56" width="912" height="912" rx="205" fill="url(#bg)"/>

  <!-- calendar header strip -->
  <rect x="220" y="200" width="584" height="150" rx="52" fill="url(#header)"/>
  <circle cx="336" cy="275" r="18" fill="rgba(255,255,255,0.9)"/>
  <circle cx="512" cy="275" r="18" fill="rgba(255,255,255,0.9)"/>
  <circle cx="688" cy="275" r="18" fill="rgba(255,255,255,0.9)"/>

  <!-- white check circle -->
  <circle cx="512" cy="590" r="250" fill="#ffffff"/>

  <!-- big green check -->
  <path d="M390 590 L475 676 L645 502" stroke="#10b981" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- sparkle -->
  <path d="M790 330 l24 56 56 24 -56 24 -24 56 -24 -56 -56 -24 56 -24 z" fill="#fde047"/>
</svg>
