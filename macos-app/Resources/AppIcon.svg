<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.18)"/>
    </linearGradient>
  </defs>

  <!-- rounded squircle with ~9% transparent margin (matches polished app icons) -->
  <rect x="90" y="90" width="844" height="844" rx="190" fill="url(#bg)"/>

  <!-- calendar header strip -->
  <rect x="248" y="220" width="528" height="150" rx="52" fill="url(#header)"/>
  <circle cx="352" cy="295" r="18" fill="rgba(255,255,255,0.9)"/>
  <circle cx="512" cy="295" r="18" fill="rgba(255,255,255,0.9)"/>
  <circle cx="672" cy="295" r="18" fill="rgba(255,255,255,0.9)"/>

  <!-- white check circle -->
  <circle cx="512" cy="590" r="245" fill="#ffffff"/>

  <!-- big green check -->
  <path d="M398 590 L478 672 L642 504" stroke="#10b981" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- sparkle -->
  <path d="M780 360 l24 56 56 24 -56 24 -24 56 -24 -56 -56 -24 56 -24 z" fill="#fde047"/>
</svg>
