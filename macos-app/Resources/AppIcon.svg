<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.18)"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background: macOS applies the rounded-corner mask itself -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- calendar header strip -->
  <rect x="190" y="180" width="644" height="150" rx="52" fill="url(#header)"/>
  <circle cx="310" cy="255" r="18" fill="rgba(255,255,255,0.9)"/>
  <circle cx="512" cy="255" r="18" fill="rgba(255,255,255,0.9)"/>
  <circle cx="714" cy="255" r="18" fill="rgba(255,255,255,0.9)"/>

  <!-- white check circle -->
  <circle cx="512" cy="600" r="245" fill="#ffffff"/>

  <!-- big green check -->
  <path d="M398 600 L478 682 L642 514" stroke="#10b981" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- sparkle -->
  <path d="M812 330 l24 56 56 24 -56 24 -24 56 -24 -56 -56 -24 56 -24 z" fill="#fde047"/>
</svg>
