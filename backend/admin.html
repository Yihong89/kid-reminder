<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Checklist Admin</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1f2430; --muted:#8a93a6; --accent:#3b82f6;
          --done:#10b981; --border:#e6e9f0; --danger:#ef4444; --urgent-bg:#fef2f2; --urgent-bd:#fecaca; --urgent-ink:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); }
  .wrap { max-width:560px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .date-line { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .date-line .date { color:var(--muted); font-size:14px; }
  .date-line button { background:none; border:1px solid var(--border); border-radius:8px; padding:4px 10px; font-size:13px; cursor:pointer; color:var(--ink); }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs .tab { flex:1; background:var(--card); border:1px solid var(--border); border-radius:10px;
               padding:9px 0; font-size:15px; font-weight:600; cursor:pointer; color:var(--muted); }
  .tabs .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px;
          padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(20,30,60,.04); }
  /* calendar */
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-head .month-label { font-weight:600; font-size:15px; }
  .cal-head button { background:none; border:1px solid var(--border); border-radius:8px; width:32px; height:32px; font-size:16px; cursor:pointer; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
  .cal-dow { font-size:11px; color:var(--muted); padding:4px 0; }
  .cal-day { position:relative; padding:8px 0 4px; border-radius:10px; cursor:pointer; font-size:14px; }
  .cal-day:hover { background:#eef2ff; }
  .cal-day.today { box-shadow:inset 0 0 0 2px var(--accent); }
  .cal-day.selected { background:var(--accent); color:#fff; }
  .cal-day.other { color:var(--muted); }
  .cal-day .dot { display:block; height:4px; width:4px; border-radius:50%; margin:3px auto 0; }
  .cal-day .dot.full { background:var(--done); }
  .cal-day .dot.part { background:#f59e0b; }
  /* task row */
  .task { display:flex; align-items:center; gap:12px; }
  .task-row.urgent { background:var(--urgent-bg); border-color:var(--urgent-bd); }
  .task .emoji { font-size:24px; width:32px; text-align:center; }
  .task .title { flex:1; font-size:17px; }
  .task-row.urgent .title { color:var(--urgent-ink); font-weight:600; }
  .task .title.done { color:var(--muted); text-decoration:line-through; }
  .task .min { font-size:12px; color:var(--muted); background:var(--bg); border-radius:99px; padding:2px 8px; white-space:nowrap; }
  .task input[type=checkbox] { width:26px; height:26px; accent-color:var(--done); cursor:pointer; }
  .task input[type=checkbox]:disabled { opacity:.35; cursor:not-allowed; }
  .task button { border:none; background:none; cursor:pointer; font-size:16px; color:var(--muted); padding:4px; }
  .task button:hover { color:var(--ink); }
  .task button.del:hover { color:var(--danger); }
  .badge { font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:99px; padding:1px 8px; white-space:nowrap; }
  .badge.once { color:var(--urgent-ink); border-color:var(--urgent-bd); background:var(--urgent-bg); }
  .badge.cnt { background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8; }
  .badge.cnt.today, .badge.cnt.overdue { background:var(--urgent-bg); border-color:var(--urgent-bd); color:var(--urgent-ink); font-weight:600; }
  .badge.cnt.future { background:var(--bg); color:var(--muted); }
  .cnt-row { display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:10px; font-size:13px; color:var(--muted); }
  .cnt-row input { font-size:14px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; }
  .ro-note { font-size:12px; color:var(--muted); margin-top:8px; }
  /* edit row */
  .edit input[type=text] { flex:1; font-size:16px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; }
  .edit select { font-size:16px; padding:7px 6px; border:1px solid var(--border); border-radius:8px; }
  .edit label { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); white-space:nowrap; }
  /* add form */
  .add { display:flex; gap:8px; flex-wrap:wrap; }
  .add input[type=text] { flex:1 1 100%; font-size:16px; padding:11px 12px; border:1px solid var(--border); border-radius:10px; }
  .add select { font-size:15px; padding:9px 8px; border:1px solid var(--border); border-radius:10px; }
  .add label { display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); }
  button.primary { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:11px 18px;
                   font-size:15px; font-weight:600; cursor:pointer; }
  button.primary:hover { filter:brightness(1.05); }
  button.ghost { background:var(--card); color:var(--ink); border:1px solid var(--border); border-radius:10px; padding:8px 12px; cursor:pointer; }
  .msg { font-size:13px; min-height:18px; margin-top:6px; }
  .msg.err { color:var(--danger); }
  .empty { text-align:center; color:var(--muted); padding:30px 0; }
  .done-summary { font-size:13px; color:var(--done); font-weight:600; margin-bottom:10px; }
  /* minutes dialog */
  dialog { border:none; border-radius:14px; padding:22px; width:300px; box-shadow:0 10px 40px rgba(20,30,60,.2); }
  dialog h3 { margin:0 0 6px; font-size:17px; }
  dialog p { margin:0 0 14px; color:var(--muted); font-size:13px; }
  dialog input { width:100%; font-size:20px; text-align:center; padding:10px; border:1px solid var(--border); border-radius:10px; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  /* pin gate */
  #pinGate { text-align:center; padding:60px 0; }
  #pinGate input { font-size:22px; letter-spacing:6px; text-align:center; padding:12px; width:180px;
                   border:1px solid var(--border); border-radius:12px; }
  #pinGate button { margin-top:14px; }
  .hint { color:var(--muted); font-size:13px; margin-top:16px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #logoutBtn { background:none; border:1px solid var(--border); border-radius:8px; padding:4px 10px; font-size:13px; cursor:pointer; color:var(--muted); }
  #logoutBtn:hover { color:var(--danger); border-color:var(--danger); }
  .kid-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .kid-title { font-size:26px; font-weight:700; }
  .kid-date { color:var(--muted); font-size:15px; margin-bottom:14px; }
  .kid-task { display:flex; align-items:center; gap:14px; background:var(--card); border:2px solid var(--border);
              border-radius:16px; padding:18px 16px; margin-bottom:12px; cursor:pointer; user-select:none; }
  .kid-task:hover { border-color:var(--accent); }
  .kid-task.busy { opacity:.6; }
  .kid-task .emoji { font-size:34px; width:44px; text-align:center; }
  .kid-task .title { flex:1; font-size:20px; font-weight:600; }
  .kid-task .min { font-size:13px; color:var(--muted); background:var(--bg); border-radius:99px; padding:2px 8px; }
  .kid-task .check { width:32px; height:32px; border-radius:50%; border:3px solid var(--border);
                     display:flex; align-items:center; justify-content:center; font-size:20px; color:transparent; flex:none; }
  .kid-task.done { background:#ecfdf5; border-color:var(--done); }
  .kid-task.done .title { color:var(--muted); text-decoration:line-through; }
  .kid-task.done .check { border-color:var(--done); background:var(--done); color:#fff; }
  .kid-task.locked { cursor:default; }
  .kid-task.locked:hover { border-color:var(--border); }
  .kid-del { border:none; background:none; cursor:pointer; font-size:18px; color:var(--muted); padding:4px; }
  .kid-del:hover { color:var(--danger); }
  .badge.mine { background:#eff6ff; border-color:#bfdbfe; color:#1d4ed8; }
  .badge.parent { background:var(--bg); color:var(--muted); }
  #fabAdd { position:fixed; right:22px; bottom:22px; width:60px; height:60px; border-radius:50%;
            background:var(--accent); color:#fff; border:none; font-size:28px; line-height:1; cursor:pointer;
            box-shadow:0 6px 18px rgba(37,99,235,.35); z-index:20; }
  #fabAdd:hover { filter:brightness(1.08); }
  #addDialog .add { gap:8px; }
  #addDialog .add input[type=text] { flex:1 1 100%; width:100%; }
  #addDialog .add select { flex:0 0 auto; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="topbar">
    <h1>✅ Kid's checklist</h1>
    <button id="logoutBtn" hidden>Log out</button>
  </div>

  <!-- PIN gate -->
  <div id="pinGate" class="card" hidden>
    <div style="font-size:40px">🔐</div>
    <p>Enter PIN</p>
    <div><input type="password" id="pinInput" inputmode="numeric" maxlength="8" /></div>
    <button class="primary" id="pinBtn">Unlock</button>
    <div class="msg err" id="pinErr"></div>
  </div>

  <!-- main -->
  <div id="main" hidden>
    <div class="tabs">
      <button class="tab active" id="tabToday">📋 Today</button>
      <button class="tab" id="tabCountdown">⏳ Countdown</button>
    </div>

    <!-- Today view -->
    <div id="todayView">
      <div class="date-line">
        <span class="date" id="date"></span>
        <button id="todayBtn">Today</button>
      </div>
      <div class="card">
        <div class="cal-head">
          <button id="prevMonth" title="previous month">‹</button>
          <span class="month-label" id="monthLabel"></span>
          <button id="nextMonth" title="next month">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="done-summary" id="summary"></div>
      <div id="list"></div>
      <div class="ro-note" id="roNote" hidden>Showing a past/future day — only today's tasks can be checked off.</div>
    </div>

    <!-- Countdown view -->
    <div id="countdownView" hidden>
      <div class="done-summary" id="cntSummary"></div>
      <div id="cntList"></div>
    </div>

    <div class="msg err" id="err"></div>

    <p class="hint">Use <b>＋</b> to add a task. Parent-created tasks can only be removed by the parent.</p>
  </div>

  <!-- kid view -->
  <div id="kidView" hidden>
    <div class="kid-top">
      <span class="kid-title">⭐ Kid</span>
    </div>
    <div class="tabs">
      <button class="tab active" id="kidTabToday">📋 Today</button>
      <button class="tab" id="kidTabCountdown">⏳ Countdown</button>
    </div>
    <div class="kid-date" id="kidDate"></div>
    <div class="done-summary" id="kidSummary"></div>
    <div id="kidList"></div>
    <div class="msg err" id="kidErr"></div>
  </div>
</div>

<button id="fabAdd" title="Add task" hidden>＋</button>

<dialog id="addDialog">
  <h3>➕ New task</h3>
  <div class="add">
    <input type="text" id="dlgTitle" placeholder="Task name…" maxlength="100" />
  </div>
  <div class="add">
    <select id="dlgEmoji"></select>
    <label><input type="checkbox" id="dlgRecurring" checked /> repeats daily</label>
  </div>
  <div class="cnt-row">
    <label>Countdown to <input type="date" id="dlgTarget" /></label>
    <label>start when <input type="number" id="dlgCountdown" min="1" max="30" value="7" style="width:70px" /> days left</label>
  </div>
  <div class="row">
    <button class="ghost" id="dlgCancel">Cancel</button>
    <button class="primary" id="dlgCreate">Create</button>
  </div>
</dialog>

<dialog id="minutesDialog">
  <h3>How long did it take? ⏱</h3>
  <p>Enter minutes spent on this task (0 is fine)</p>
  <input type="number" id="minInput" min="0" max="999" inputmode="numeric" autofocus />
  <div class="row">
    <button class="ghost" id="minCancel">Cancel</button>
    <button class="primary" id="minOk">Save</button>
  </div>
</dialog>

<script>
  const $ = (s) => document.querySelector(s);
  let pin = sessionStorage.getItem("pin") || "";
  let role = sessionStorage.getItem("role") || null; // "admin" | "kid"
  let tasks = [];
  let selectedDate = todayStr();
  let viewYear, viewMonth;
  let tab = "today"; // "today" | "countdown"
  const dayFlags = {}; // date -> {total, done}

  const EMOJIS = [
    ["", "none"], ["🦷","brush teeth"], ["🪥","teeth"], ["🛁","bath"], ["🧼","wash"],
    ["📚","homework"], ["✏️","write"], ["📖","read"], ["🎨","art"], ["🎹","piano"], ["🎸","guitar"],
    ["💧","water"], ["🍎","fruit"], ["🥦","veg"], ["🍽️","meals"], ["🍵","tea"],
    ["🛏️","bed"], ["🌅","morning"], ["🌙","night"], ["😴","sleep"], ["☀️","day"],
    ["🎒","school"], ["🏃","run"], ["⚽","football"], ["🏀","ball"], ["💪","workout"],
    ["🧹","chores"], ["🧺","laundry"], ["🐶","dog"], ["🪴","plant"], ["🧠","focus"], ["⭐","star"],
  ];

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  function prettyDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric", year: d.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined });
  }
  function emojiOptions(selected) {
    return EMOJIS.map(([e,l]) => `<option value="${e}" ${e===selected?"selected":""}>${e} ${l}</option>`).join("");
  }

  async function api(path, opts = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (role === "kid") headers["X-Kid-Pin"] = pin;
    else if (pin) headers["X-Admin-Pin"] = pin;
    const res = await fetch(path, Object.assign({}, opts, { headers }));
    let body = {};
    try { body = await res.json(); } catch {}
    if (!res.ok) throw Object.assign(new Error(body.error || "request failed"), { status: res.status });
    return body;
  }

  // ---- calendar -----------------------------------------------------------
  function renderCalendar() {
    const first = new Date(viewYear, viewMonth, 1);
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const startDow = first.getDay(); // 0=Sunday
    const grid = $("#calGrid");
    grid.innerHTML = '<div class="cal-dow">S</div><div class="cal-dow">M</div><div class="cal-dow">T</div><div class="cal-dow">W</div><div class="cal-dow">T</div><div class="cal-dow">F</div><div class="cal-dow">S</div>';
    for (let i = 0; i < startDow; i++) grid.insertAdjacentHTML("beforeend", '<div class="cal-day other"></div>');
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${viewYear}-${String(viewMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const cls = ["cal-day"];
      if (iso === todayStr()) cls.push("today");
      if (iso === selectedDate) cls.push("selected");
      const fl = dayFlags[iso];
      const dot = fl && fl.total > 0 ? `<span class="dot ${fl.done === fl.total ? "full" : "part"}"></span>` : "";
      grid.insertAdjacentHTML("beforeend", `<div class="${cls.join(" ")}" data-date="${iso}">${d}${dot}</div>`);
    }
    $("#monthLabel").textContent = new Date(viewYear, viewMonth, 1).toLocaleDateString(undefined, { month:"long", year:"numeric" });
    document.querySelectorAll(".cal-day[data-date]").forEach((el) => {
      el.onclick = () => { selectedDate = el.dataset.date; renderCalendar(); refresh(); };
    });
  }

  // fetch done/total for every day of the visible month (cheap on LAN)
  async function refreshDayFlags() {
    const days = new Date(viewYear, viewMonth + 1, 0).getDate();
    const dates = [];
    for (let d = 1; d <= days; d++) dates.push(`${viewYear}-${String(viewMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
    const results = await Promise.all(dates.map((iso) => api(`/api/tasks?date=${iso}&type=todo`).catch(() => null)));
    results.forEach((data, i) => {
      if (!data) return;
      const total = data.tasks.length;
      const done = data.tasks.filter((t) => t.done).length;
      dayFlags[dates[i]] = { total, done };
    });
    renderCalendar();
  }

  // ---- list ---------------------------------------------------------------
  function render() {
    const doneCount = tasks.filter((t) => t.done).length;
    $("#summary").textContent = tasks.length ? `${doneCount} of ${tasks.length} done` : "";
    const isToday = selectedDate === todayStr();
    $("#roNote").hidden = isToday;
    const list = $("#list");
    list.innerHTML = "";
    if (!tasks.length) { list.innerHTML = '<div class="empty">No tasks for this day.</div>'; return; }
    for (const t of tasks) list.appendChild(taskRow(t, allowDoneFor(t)));
  }

  // can this task be checked off right now? (today's checklist: only today;
  // countdown events: only on/after their day)
  function allowDoneFor(t) {
    if (tab === "today") return selectedDate === todayStr();
    return t.daysLeft !== null && t.daysLeft <= 0;
  }

  function taskRow(t, allowDone) {
    const card = document.createElement("div");
    card.className = "card task-row" + (t.recurring ? "" : !t.done ? " urgent" : "");
    card.dataset.id = t.id;
    const minBadge = t.done && t.minutes > 0 ? `<span class="min">⏱ ${t.minutes}m</span>` : "";
    card.innerHTML = `
      <div class="task">
        <span class="emoji">${t.emoji || "📝"}</span>
        <span class="title ${t.done ? "done" : ""}">${escapeHtml(t.title)}</span>
        ${t.recurring ? "" : '<span class="badge once">once</span>'}
        ${minBadge}
        ${countdownBadge(t)}
        <input type="checkbox" ${t.done ? "checked" : ""} ${allowDone ? "" : "disabled"} title="${allowDone ? "done" : "view-only"}" />
        <button class="edit" title="edit">✏️</button>
        <button class="del" title="delete">🗑️</button>
      </div>`;
    card.querySelector("input[type=checkbox]").onchange = async () => {
      if (!t.done) {
        // marking done -> ask for minutes
        const minutes = await askMinutes();
        if (minutes === null) { render(); return; } // cancelled
        try { await api(`/api/tasks/${t.id}/toggle`, { method: "POST", body: JSON.stringify({ minutes }) }); await afterChange(); }
        catch (e) { showErr(e.message); }
      } else {
        try { await api(`/api/tasks/${t.id}/toggle`, { method: "POST", body: "{}" }); await afterChange(); }
        catch (e) { showErr(e.message); }
      }
    };
    card.querySelector(".del").onclick = async () => {
      if (!confirm(`Delete "${t.title}"?`)) return;
      try { await api(`/api/tasks/${t.id}`, { method: "DELETE" }); await afterChange(); }
      catch (e) { showErr(e.message); }
    };
    card.querySelector(".edit").onclick = () => { card.replaceWith(editRow(t)); };
    return card;
  }

  function editRow(t) {
    const card = document.createElement("div");
    card.className = "card edit";
    card.innerHTML = `
      <div class="task">
        <select class="emoji-in">${emojiOptions(t.emoji)}</select>
        <input type="text" value="${escapeHtml(t.title)}" maxlength="100" />
        <label><input type="checkbox" ${t.recurring ? "checked" : ""} /> daily</label>
        <button class="primary save">Save</button>
        <button class="ghost cancel">Cancel</button>
      </div>
      <div class="cnt-row">
        <label>Countdown to <input type="date" class="target-in" value="${t.targetDate || ""}" /></label>
        <label>start when <input type="number" class="cnt-in" min="1" max="30" value="${t.countdownStart || 7}" style="width:70px" /> days left</label>
      </div>`;
    card.querySelector(".save").onclick = async () => {
      const emoji = card.querySelector(".emoji-in").value;
      const title = card.querySelector("input[type=text]").value.trim();
      const recurring = card.querySelector("input[type=checkbox]").checked;
      const willHaveTarget = !!card.querySelector(".target-in").value;
      if (!title) return;
      try {
        await api(`/api/tasks/${t.id}`, {
          method: "PATCH",
          body: JSON.stringify({
            title, emoji, recurring,
            targetDate: card.querySelector(".target-in").value,
            countdownStart: Number(card.querySelector(".cnt-in").value) || 7,
          }),
        });
        setTab(willHaveTarget ? "countdown" : "today");
      } catch (e) { showErr(e.message); }
    };
    card.querySelector(".cancel").onclick = () => card.replaceWith(taskRow(t, allowDoneFor(t)));
    return card;
  }

  // countdown badge for future-dated tasks
  function countdownBadge(t) {
    if (!t.targetDate || t.daysLeft === null) return "";
    const d = t.daysLeft;
    if (d < 0) return `<span class="badge cnt overdue">⏰ ${-d}d ago</span>`;
    if (d === 0) return `<span class="badge cnt today">📅 Today!</span>`;
    if (d <= t.countdownStart) return `<span class="badge cnt">⏳ ${d}d</span>`;
    return `<span class="badge cnt future">📅 in ${d}d</span>`;
  }

  // minutes prompt dialog -> Promise<number|null>
  function askMinutes() {
    return new Promise((resolve) => {
      const dlg = $("#minutesDialog");
      const input = $("#minInput");
      input.value = "";
      dlg.showModal();
      const done = (val) => { dlg.close(); resolve(val); };
      $("#minOk").onclick = () => done(Math.max(0, Math.round(Number(input.value) || 0)));
      $("#minCancel").onclick = () => done(null);
      dlg.oncancel = () => done(null);
      input.onkeydown = (e) => { if (e.key === "Enter") done(Math.max(0, Math.round(Number(input.value) || 0))); };
    });
  }

  async function afterChange() {
    if (tab === "today") { await refresh(); await refreshDayFlags(); }
    else { await refreshCountdown(); }
  }

  function setTab(t) {
    tab = t;
    $("#tabToday").classList.toggle("active", t === "today");
    $("#tabCountdown").classList.toggle("active", t === "countdown");
    $("#todayView").hidden = t !== "today";
    $("#countdownView").hidden = t !== "countdown";
    if (t === "today") { refresh(); refreshDayFlags(); } else { refreshCountdown(); }
  }

  async function refresh() {
    try {
      const data = await api(`/api/tasks?date=${selectedDate}&type=todo`);
      tasks = data.tasks;
      $("#date").textContent = prettyDate(selectedDate);
      render();
    } catch (e) { showErr(e.message); }
  }

  async function refreshCountdown() {
    try {
      const data = await api("/api/tasks?type=countdown");
      const list = data.tasks.slice().sort((a, b) => (a.daysLeft ?? 999) - (b.daysLeft ?? 999));
      const active = list.filter((t) => t.daysLeft >= 0 && t.daysLeft <= t.countdownStart).length;
      const overdue = list.filter((t) => t.daysLeft < 0).length;
      $("#cntSummary").textContent = list.length
        ? `${list.length} event${list.length > 1 ? "s" : ""} · ${active} in countdown · ${overdue} overdue`
        : "";
      const el = $("#cntList");
      el.innerHTML = "";
      if (!list.length) { el.innerHTML = '<div class="empty">No countdown events yet — add a task with a target date.</div>'; return; }
      for (const t of list) el.appendChild(taskRow(t, allowDoneFor(t)));
    } catch (e) { showErr(e.message); }
  }

  function showErr(msg) {
    $("#err").textContent = msg;
    setTimeout(() => { $("#err").textContent = ""; }, 4000);
  }
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  // ---- pin gate -----------------------------------------------------------
  async function unlock() {
    const value = $("#pinInput").value.trim();
    if (!value) return;
    try {
      const res = await api("/api/verify", { method: "POST", body: JSON.stringify({ pin: value }) });
      pin = value;
      role = res.role; // "admin" | "kid"
      sessionStorage.setItem("pin", pin);
      sessionStorage.setItem("role", role);
      $("#pinErr").textContent = "";
      showMain();
    } catch {
      $("#pinErr").textContent = "Wrong PIN";
    }
  }
  function showMain() {
    $("#pinGate").hidden = true;
    $("#logoutBtn").hidden = false;
    $("#fabAdd").hidden = false;
    if (role === "kid") {
      $("#main").hidden = true;
      $("#kidView").hidden = false;
      kidTab = "today";
      $("#kidTabToday").onclick = () => setKidTab("today");
      $("#kidTabCountdown").onclick = () => setKidTab("countdown");
      refreshKid();
    } else {
      $("#kidView").hidden = true;
      $("#main").hidden = false;
      showAdmin();
    }
  }
  function showAdmin() {
    const d = new Date();
    viewYear = d.getFullYear(); viewMonth = d.getMonth();
    $("#tabToday").onclick = () => setTab("today");
    $("#tabCountdown").onclick = () => setTab("countdown");
    refresh();
    refreshDayFlags();
  }

  // ---- kid view ---------------------------------------------------------
  let kidTab = "today"; // "today" | "countdown"

  function setKidTab(t) {
    kidTab = t;
    $("#kidTabToday").classList.toggle("active", t === "today");
    $("#kidTabCountdown").classList.toggle("active", t === "countdown");
    refreshKid();
  }

  async function refreshKid() {
    try {
      const type = kidTab === "countdown" ? "countdown" : "todo";
      const data = await api(`/api/tasks?type=${type}`);
      let list = data.tasks;
      if (kidTab === "countdown") list = list.slice().sort((a, b) => (a.daysLeft ?? 999) - (b.daysLeft ?? 999));
      $("#kidDate").textContent = prettyDate(data.today);
      const done = list.filter((t) => t.done).length;
      $("#kidSummary").textContent = kidTab === "countdown"
        ? (list.length ? `${list.length} event${list.length > 1 ? "s" : ""}` : "")
        : (list.length ? (done === list.length ? "🎉 All done! Great job!" : `${done} of ${list.length} done`) : "");
      const el = $("#kidList");
      el.innerHTML = "";
      if (!list.length) {
        el.innerHTML = kidTab === "countdown" ? '<div class="empty">No countdown events yet.</div>' : '<div class="empty">Nothing to do today! 🎉</div>';
        return;
      }
      for (const t of list) el.appendChild(kidTaskRow(t));
    } catch (e) { $("#kidErr").textContent = e.message; }
  }

  function kidTaskRow(t) {
    const canToggle = kidTab === "today" || (t.daysLeft !== null && t.daysLeft <= 0);
    const mine = t.createdBy === "kid";
    const row = document.createElement("div");
    row.className = "kid-task" + (t.done ? " done" : "") + (canToggle ? "" : " locked");
    row.innerHTML = `
      <span class="emoji">${t.emoji || "📝"}</span>
      <span class="title">${escapeHtml(t.title)}</span>
      ${mine ? '<span class="badge mine">👤 mine</span>' : '<span class="badge parent">👨‍👩‍👧</span>'}
      ${countdownBadge(t)}
      ${t.done && t.minutes > 0 ? `<span class="min">⏱ ${t.minutes}m</span>` : ""}
      ${mine ? '<button class="kid-del" title="delete">🗑️</button>' : ""}
      <span class="check">✓</span>`;
    const delBtn = row.querySelector(".kid-del");
    if (delBtn) {
      delBtn.onclick = async (e) => {
        e.stopPropagation();
        if (!confirm(`Delete "${t.title}"?`)) return;
        try { await api(`/api/tasks/${t.id}`, { method: "DELETE" }); refreshKid(); }
        catch (err) { $("#kidErr").textContent = err.message; }
      };
    }
    row.onclick = async () => {
      if (!canToggle) return;
      row.classList.add("busy");
      if (!t.done) {
        const minutes = await askMinutes();
        if (minutes === null) { row.classList.remove("busy"); return; }
        try { await api(`/api/tasks/${t.id}/toggle`, { method: "POST", body: JSON.stringify({ minutes }) }); }
        catch (e) { $("#kidErr").textContent = e.message; }
      } else {
        try { await api(`/api/tasks/${t.id}/toggle`, { method: "POST", body: "{}" }); }
        catch (e) { $("#kidErr").textContent = e.message; }
      }
      row.classList.remove("busy");
      refreshKid();
    };
    return row;
  }

  $("#pinBtn").onclick = unlock;
  $("#pinInput").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
  $("#logoutBtn").onclick = () => {
    sessionStorage.removeItem("pin");
    sessionStorage.removeItem("role");
    pin = ""; role = null;
    $("#main").hidden = true;
    $("#kidView").hidden = true;
    $("#logoutBtn").hidden = true;
    $("#fabAdd").hidden = true;
    $("#pinGate").hidden = false;
    $("#pinInput").value = "";
    $("#pinInput").focus();
  };
  $("#todayBtn").onclick = () => {
    const d = new Date();
    viewYear = d.getFullYear(); viewMonth = d.getMonth();
    selectedDate = todayStr();
    renderCalendar(); refresh(); refreshDayFlags();
  };
  $("#prevMonth").onclick = () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } refreshDayFlags(); };
  $("#nextMonth").onclick = () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } refreshDayFlags(); };
  // add-task popup
  function openAddDialog() {
    $("#dlgTitle").value = "";
    $("#dlgEmoji").innerHTML = emojiOptions("");
    $("#dlgRecurring").checked = true;
    $("#dlgTarget").value = "";
    $("#dlgCountdown").value = 7;
    $("#addDialog").showModal();
    $("#dlgTitle").focus();
  }
  $("#fabAdd").onclick = openAddDialog;
  $("#dlgCancel").onclick = () => $("#addDialog").close();
  $("#dlgCreate").onclick = async () => {
    const title = $("#dlgTitle").value.trim();
    if (!title) return;
    const hadTarget = !!$("#dlgTarget").value;
    try {
      await api("/api/tasks", {
        method: "POST",
        body: JSON.stringify({
          title,
          emoji: $("#dlgEmoji").value,
          recurring: $("#dlgRecurring").checked,
          targetDate: $("#dlgTarget").value,
          countdownStart: Number($("#dlgCountdown").value) || 7,
        }),
      });
      $("#addDialog").close();
      if (role === "kid") setKidTab(hadTarget ? "countdown" : "today");
      else if (hadTarget) setTab("countdown");
      else { refresh(); refreshDayFlags(); }
    } catch (e) { showErr(e.message); }
  };
  $("#dlgTitle").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#dlgCreate").click(); });

  if (pin && role) { showMain(); } else { $("#pinGate").hidden = false; }
</script>
</body>
</html>
